; CareLoop 専用の PHP-FPM プール（nginx から受けたリクエストを PHP で処理するプロセスの設定）。
;
; setup.sh が /etc/php/8.4/fpm/pool.d/careloop.conf に置く。
;
; アプリのファイルを持つ careloop ユーザーで PHP を動かす。nginx と同じ www-data で動かすと、
; ログやキャッシュを書けるように権限を広げる必要が出る。

[careloop]
user = careloop
group = careloop

listen = /run/php/php8.4-fpm-careloop.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 1GB のサーバーでは PHP のプロセスを常駐させない。リクエストが来たときだけ起動し、
; 30 秒使われなければ終了する。同時に動くのは 4 つまで（公開デモの閲覧は数人）。
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

; AI 処理はキューで動くので、画面のリクエストが長くかかることはない。
; 何かで固まったときに、プロセスを握ったままにしない。
request_terminate_timeout = 60s
php_admin_value[memory_limit] = 256M
