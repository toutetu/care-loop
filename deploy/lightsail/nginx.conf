# CareLoop の Web サーバー（nginx）の設定。
#
# setup.sh が __DOMAIN__ をドメイン名に置き換えて /etc/nginx/sites-available/careloop に置く。
# HTTPS（443 番）の設定と、http から https への転送は、certbot があとから書き足す。
#
# 中身は Laravel の公式ドキュメントにある nginx の設定例に、次の 3 点を足したもの。
#   - ビルド済みの JS/CSS を長く持たせる
#   - JS/CSS/JSON を圧縮して送る
#   - PHP のバージョンを応答ヘッダーに出さない

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root /var/www/care-loop/public;

    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite が出力するファイルは名前に内容のハッシュが入る。中身が変われば名前も変わるので、
    # ブラウザに 1 年持たせても古い画面が残ることはない。
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-careloop.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # .env や .git を外から読ませない。.well-known はパスキーと証明書の取得に使うので通す。
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
