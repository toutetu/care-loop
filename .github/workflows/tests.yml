name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # composer setup が走らせる migrate を sqlite へ向ける。
    # テストは phpunit.xml で :memory: の sqlite を使うため、CI の検証に
    # MySQL は要らない。Dotenv は既に設定済みの環境変数を上書きしないので、
    # ここでの指定が composer setup の作る .env より優先される。
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # migrate は空ファイルがないと落ちる。--force では作成の確認も出せない。
      - name: Create SQLite database
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
